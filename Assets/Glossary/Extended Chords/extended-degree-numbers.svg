<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 352" font-family="sans-serif">
  <rect width="620" height="352" fill="#fafafa"/>
  <text x="310" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#243447">Counting past the octave: 9 = 2, 11 = 4, 13 = 6</text>
  <text x="310" y="44" text-anchor="middle" font-size="12" fill="#243447"><tspan fill="#c9622a" font-weight="bold">Same key, octave up:</tspan> 9 = D · 11 = F · 13 = A</text>
  <path d="M14 92 V86 H286 V92" fill="none" stroke="#2c6fbb" stroke-width="2"/>
  <text x="150" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c6fbb">1st octave</text>
  <path d="M294 92 V86 H606 V92" fill="none" stroke="#c9622a" stroke-width="2"/>
  <text x="450" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#c9622a">2nd octave</text>
  <g transform="translate(0,96)">
    <g stroke="#333" stroke-width="1.5">
      <rect x="10" y="0" width="40" height="180" fill="#ffffff"/><rect x="50" y="0" width="40" height="180" fill="#ffffff"/><rect x="90" y="0" width="40" height="180" fill="#ffffff"/><rect x="130" y="0" width="40" height="180" fill="#ffffff"/><rect x="170" y="0" width="40" height="180" fill="#ffffff"/><rect x="210" y="0" width="40" height="180" fill="#ffffff"/><rect x="250" y="0" width="40" height="180" fill="#ffffff"/><rect x="290" y="0" width="40" height="180" fill="#ffffff"/><rect x="330" y="0" width="40" height="180" fill="#ffffff"/><rect x="370" y="0" width="40" height="180" fill="#ffffff"/><rect x="410" y="0" width="40" height="180" fill="#ffffff"/><rect x="450" y="0" width="40" height="180" fill="#ffffff"/><rect x="490" y="0" width="40" height="180" fill="#ffffff"/><rect x="530" y="0" width="40" height="180" fill="#ffffff"/><rect x="570" y="0" width="40" height="180" fill="#ffffff"/>
    </g>
    <g stroke="#000" stroke-width="1" fill="#222222">
      <rect x="38" y="0" width="24" height="110"/><rect x="78" y="0" width="24" height="110"/><rect x="158" y="0" width="24" height="110"/><rect x="198" y="0" width="24" height="110"/><rect x="238" y="0" width="24" height="110"/><rect x="318" y="0" width="24" height="110"/><rect x="358" y="0" width="24" height="110"/><rect x="438" y="0" width="24" height="110"/><rect x="478" y="0" width="24" height="110"/><rect x="518" y="0" width="24" height="110"/>

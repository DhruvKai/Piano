  <text x="310" y="328" text-anchor="middle" font-size="10" fill="#52616b">Keep counting the C major scale past 8 instead of starting again at 1.</text>
  <text x="310" y="342" text-anchor="middle" font-size="10" fill="#52616b">Extensions are just 2, 4 and 6 played an octave higher. Green = C.</text>

      <text x="30" y="167">1</text><text x="70" y="167">2</text><text x="110" y="167">3</text><text x="150" y="167">4</text><text x="190" y="167">5</text><text x="230" y="167">6</text><text x="270" y="167">7</text><text x="310" y="167">8</text><text x="350" y="167">9</text><text x="390" y="167">10</text><text x="430" y="167">11</text><text x="470" y="167">12</text><text x="510" y="167">13</text><text x="550" y="167">14</text><text x="590" y="167">15</text>

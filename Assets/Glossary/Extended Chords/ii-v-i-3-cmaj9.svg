  <text x="350" y="44" text-anchor="middle" font-size="12" fill="#243447"><tspan fill="#c9622a" font-weight="bold">LH:</tspan> C   <tspan fill="#3a8f5c" font-weight="bold">RH:</tspan> E G B D</text>

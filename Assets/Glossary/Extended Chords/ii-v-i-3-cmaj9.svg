  <text x="350" y="328" text-anchor="middle" font-size="10" fill="#52616b">From G13 every RH key slides down to its nearest chord tone.</text>
  <text x="350" y="342" text-anchor="middle" font-size="10" fill="#52616b">Badges = chord degree. Green = root (LH). RH fingers 1-2-3-5 or 1-2-4-5, low to high.</text>

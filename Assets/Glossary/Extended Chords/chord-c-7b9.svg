<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 352" font-family="sans-serif">
  <rect width="620" height="352" fill="#fafafa"/>
  <text x="310" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#243447">C7♭9 — C E G A# C#</text>
  <text x="310" y="44" text-anchor="middle" font-size="12" fill="#243447"><tspan fill="#2c6fbb" font-weight="bold">Formula:</tspan> R 3 5 ♭7 ♭9   <tspan fill="#c9622a" font-weight="bold">Usually played:</tspan> C E A# C#</text>
  <path d="M14 92 V86 H286 V92" fill="none" stroke="#2c6fbb" stroke-width="2"/>
  <text x="150" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c6fbb">dominant 7 chord</text>
  <path d="M294 92 V86 H566 V92" fill="none" stroke="#c9622a" stroke-width="2"/>
  <text x="430" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#c9622a">extensions (2nd octave)</text>
  <g transform="translate(0,96)">

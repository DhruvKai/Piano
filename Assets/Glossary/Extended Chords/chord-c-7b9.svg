  <text x="310" y="328" text-anchor="middle" font-size="10" fill="#52616b">Badges = chord degree, not playing order. Green = root. Grey = usually left out.</text>
  <text x="310" y="342" text-anchor="middle" font-size="10" fill="#52616b">Every note stacked in thirds to show the theory — not a hand shape. See the note for voicings.</text>

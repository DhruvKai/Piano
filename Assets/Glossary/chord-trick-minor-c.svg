    <g><text x="39.0" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#243447">C</text><text x="85.0" y="56" text-anchor="middle" font-size="12" font-weight="bold" fill="#eee">C#</text><text x="131.0" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#243447">D</text><text x="177.0" y="56" text-anchor="middle" font-size="12" font-weight="bold" fill="#eee">D#</text><text x="223.0" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#243447">E</text><text x="269.0" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#243447">F</text><text x="315.0" y="56" text-anchor="middle" font-size="12" font-weight="bold" fill="#eee">F#</text><text x="361.0" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#243447">G</text></g>

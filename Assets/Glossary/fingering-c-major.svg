<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" font-family="sans-serif">
  <rect width="320" height="250" fill="#fafafa"/>
  <text x="160" y="16" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#243447">C Major — Right Hand Fingering (one map, both directions)</text>
  <g transform="translate(0,26)">
    <g stroke="#333" stroke-width="1.5">
<rect x="0" y="0" width="40" height="180" fill="#ffffff"/><rect x="40" y="0" width="40" height="180" fill="#ffffff"/><rect x="80" y="0" width="40" height="180" fill="#ffffff"/><rect x="120" y="0" width="40" height="180" fill="#ffffff"/><rect x="160" y="0" width="40" height="180" fill="#ffffff"/><rect x="200" y="0" width="40" height="180" fill="#ffffff"/><rect x="240" y="0" width="40" height="180" fill="#ffffff"/><rect x="280" y="0" width="40" height="180" fill="#ffffff"/>
    </g>
    <g stroke="#000" stroke-width="1" fill="#222222">
<rect x="28" y="0" width="24" height="110"/><rect x="68" y="0" width="24" height="110"/><rect x="148" y="0" width="24" height="110"/><rect x="188" y="0" width="24" height="110"/><rect x="228" y="0" width="24" height="110"/>
    </g>
    <g fill="#888" font-size="12" text-anchor="middle">
<text x="20" y="132">C</text><text x="60" y="132">D</text><text x="100" y="132">E</text><text x="140" y="132">F</text><text x="180" y="132">G</text><text x="220" y="132">A</text><text x="260" y="132">B</text><text x="300" y="132">C</text>
    </g>
    <g><circle cx="20" cy="162" r="14" fill="#c98a2a"/><circle cx="60" cy="162" r="14" fill="#2c6fbb"/><circle cx="100" cy="162" r="14" fill="#2c6fbb"/><circle cx="140" cy="162" r="14" fill="#c98a2a"/><circle cx="180" cy="162" r="14" fill="#2c6fbb"/><circle cx="220" cy="162" r="14" fill="#2c6fbb"/><circle cx="260" cy="162" r="14" fill="#2c6fbb"/><circle cx="300" cy="162" r="14" fill="#2c6fbb"/></g>
    <g fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle"><text x="20" y="167">1</text><text x="60" y="167">2</text><text x="100" y="167">3</text><text x="140" y="167">1</text><text x="180" y="167">2</text><text x="220" y="167">3</text><text x="260" y="167">4</text><text x="300" y="167">5</text></g>
  </g>
  <text x="160" y="220" text-anchor="middle" font-size="10" fill="#3a8f5c">▶ Ascending — start root, finger 1 (thumb)</text>
  <text x="160" y="233" text-anchor="middle" font-size="10" fill="#7a4fa0">◀ Descending — start octave, finger 5 — not the thumb here, same keys backwards</text>
  <text x="160" y="246" text-anchor="middle" font-size="9.5" fill="#52616b">Amber = thumb (finger 1) — every amber badge is a crossing point.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" font-family="sans-serif">
  <rect width="320" height="250" fill="#fafafa"/>
  <text x="160" y="16" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#243447">F# Major — Right Hand Fingering (one map, both directions)</text>
  <g transform="translate(0,26)">
    <g stroke="#333" stroke-width="1.5">
<rect x="24" y="0" width="40" height="180" fill="#ffffff"/><rect x="64" y="0" width="40" height="180" fill="#ffffff"/><rect x="104" y="0" width="40" height="180" fill="#ffffff"/><rect x="144" y="0" width="40" height="180" fill="#ffffff"/><rect x="184" y="0" width="40" height="180" fill="#ffffff"/><rect x="224" y="0" width="40" height="180" fill="#ffffff"/><rect x="264" y="0" width="40" height="180" fill="#ffffff"/>
    </g>
    <g stroke="#000" stroke-width="1" fill="#222222">
<rect x="0" y="0" width="24" height="110"/><rect x="52" y="0" width="24" height="110"/><rect x="92" y="0" width="24" height="110"/><rect x="172" y="0" width="24" height="110"/><rect x="212" y="0" width="24" height="110"/><rect x="292" y="0" width="24" height="110"/>
    </g>
    <g fill="#888" font-size="12" text-anchor="middle">
<text x="44" y="132">G</text><text x="84" y="132">A</text><text x="124" y="132">B</text><text x="164" y="132">C</text><text x="204" y="132">D</text><text x="244" y="132">E</text><text x="284" y="132">F</text>
    </g>
    <g><circle cx="12" cy="90" r="12" fill="#2c6fbb" stroke="#fff" stroke-width="1.5"/><circle cx="64" cy="90" r="12" fill="#2c6fbb" stroke="#fff" stroke-width="1.5"/><circle cx="104" cy="90" r="12" fill="#2c6fbb" stroke="#fff" stroke-width="1.5"/><circle cx="124" cy="162" r="14" fill="#c98a2a"/><circle cx="184" cy="90" r="12" fill="#2c6fbb" stroke="#fff" stroke-width="1.5"/><circle cx="224" cy="90" r="12" fill="#2c6fbb" stroke="#fff" stroke-width="1.5"/><circle cx="284" cy="162" r="14" fill="#c98a2a"/><circle cx="304" cy="90" r="12" fill="#2c6fbb" stroke="#fff" stroke-width="1.5"/></g>
    <g fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle"><text x="12" y="94" font-size="10">2</text><text x="64" y="94" font-size="10">3</text><text x="104" y="94" font-size="10">4</text><text x="124" y="167">1</text><text x="184" y="94" font-size="10">2</text><text x="224" y="94" font-size="10">3</text><text x="284" y="167">1</text><text x="304" y="94" font-size="10">2</text></g>
  </g>
  <text x="160" y="220" text-anchor="middle" font-size="10" fill="#3a8f5c">▶ Ascending — start root, finger 2 — not the thumb here</text>
  <text x="160" y="233" text-anchor="middle" font-size="10" fill="#7a4fa0">◀ Descending — start octave, finger 2 — not the thumb here, same keys backwards</text>
  <text x="160" y="246" text-anchor="middle" font-size="9.5" fill="#52616b">Amber = thumb (finger 1) — every amber badge is a crossing point.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" font-family="sans-serif">
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <text x="100" y="16" text-anchor="middle" font-size="12" fill="#333">Semitone (ST) vs Tone (T)</text>

  <!-- Tone arc: C to D (taller, spans further) -->
  <path d="M40,150 Q60,52 80,150" fill="none" stroke="#2c6fbb" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="63" y="58" text-anchor="middle" font-size="11" fill="#2c6fbb" font-weight="bold">T (whole step)</text>

  <!-- Semitone arc: C to C# (short) -->
  <path d="M40,150 Q50,112 60,150" fill="none" stroke="#c9622a" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="50" y="118" text-anchor="middle" font-size="10" fill="#c9622a" font-weight="bold">ST</text>

  <g transform="translate(20,150)">
    <!-- white keys: C D E -->
    <g stroke="#333" stroke-width="1.5">
      <rect x="0"  y="0" width="40" height="140" fill="#ffffff"/>
      <rect x="40" y="0" width="40" height="140" fill="#ffffff"/>
      <rect x="80" y="0" width="40" height="140" fill="#ffffff"/>
    </g>
    <!-- black keys: C# D# -->
    <g stroke="#000" stroke-width="1">
      <rect x="28" y="0" width="24" height="85" fill="#222222"/>
      <rect x="68" y="0" width="24" height="85" fill="#222222"/>
    </g>

    <!-- highlights -->
    <rect x="0"  y="100" width="40" height="40" fill="#3a8f5c"/> <!-- C: start -->
    <rect x="40" y="100" width="40" height="40" fill="#2c6fbb"/> <!-- D: tone target -->
    <rect x="28" y="45"  width="24" height="40" fill="#c9622a"/> <!-- C#: semitone target -->

    <g font-size="13" text-anchor="middle" font-weight="bold" fill="#ffffff">
      <text x="20" y="126">C</text>
      <text x="60" y="126">D</text>
    </g>
    <text x="40" y="70" font-size="10" text-anchor="middle" font-weight="bold" fill="#ffffff">C#</text>
    <text x="120" y="126" font-size="13" text-anchor="middle" fill="#888">E</text>
  </g>

  <text x="100" y="288" text-anchor="middle" font-size="10" fill="#666">C→C# = 1 half step (ST, the smallest gap).</text>
  <text x="100" y="300" text-anchor="middle" font-size="10" fill="#666">C→D = 2 half steps = 1 whole step (T).</text>
</svg>

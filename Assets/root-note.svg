<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 270" font-family="sans-serif">
  <text x="160" y="16" text-anchor="middle" font-size="13" fill="#333">Root Note — same shape, different starting key</text>

  <!-- flags pointing at 3 example roots -->
  <g font-size="10" font-weight="bold" text-anchor="middle">
    <text x="20" y="32" fill="#3a8f5c">ROOT</text>
    <text x="20" y="44" fill="#3a8f5c">(C major)</text>
    <line x1="20" y1="48" x2="20" y2="88" stroke="#3a8f5c" stroke-width="2"/>

    <text x="180" y="32" fill="#2c6fbb">ROOT</text>
    <text x="180" y="44" fill="#2c6fbb">(G major)</text>
    <line x1="180" y1="48" x2="180" y2="88" stroke="#2c6fbb" stroke-width="2"/>

    <text x="240" y="32" fill="#c9622a">ROOT</text>
    <text x="240" y="44" fill="#c9622a">(F# major)</text>
    <line x1="240" y1="48" x2="240" y2="88" stroke="#c9622a" stroke-width="2"/>
  </g>

  <g transform="translate(0,88)">
    <!-- white keys -->
    <g stroke="#333" stroke-width="1.5">
      <rect x="0"   y="0" width="40" height="180" fill="#ffffff"/>
      <rect x="40"  y="0" width="40" height="180" fill="#ffffff"/>
      <rect x="80"  y="0" width="40" height="180" fill="#ffffff"/>
      <rect x="120" y="0" width="40" height="180" fill="#ffffff"/>
      <rect x="160" y="0" width="40" height="180" fill="#ffffff"/>
      <rect x="200" y="0" width="40" height="180" fill="#ffffff"/>
      <rect x="240" y="0" width="40" height="180" fill="#ffffff"/>
      <rect x="280" y="0" width="40" height="180" fill="#ffffff"/>
    </g>
    <!-- black keys -->
    <g stroke="#000" stroke-width="1" fill="#222222">
      <rect x="28"  y="0" width="24" height="110"/>
      <rect x="68"  y="0" width="24" height="110"/>
      <rect x="148" y="0" width="24" height="110"/>
      <rect x="188" y="0" width="24" height="110"/>
      <rect x="228" y="0" width="24" height="110"/>
    </g>

    <!-- root badges -->
    <circle cx="20"  cy="160" r="14" fill="#3a8f5c"/>
    <circle cx="180" cy="160" r="14" fill="#2c6fbb"/>
    <circle cx="240" cy="85"  r="12" fill="#c9622a" stroke="#fff" stroke-width="1.5"/>

    <g fill="#666" font-size="13" text-anchor="middle">
      <text x="60"  y="145">D</text>
      <text x="100" y="145">E</text>
      <text x="140" y="145">F</text>
      <text x="220" y="145">A</text>
      <text x="260" y="145">B</text>
      <text x="300" y="145">C</text>
    </g>
    <g fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">
      <text x="20"  y="165">C</text>
      <text x="180" y="165">G</text>
      <text x="240" y="90" font-size="10">F#</text>
    </g>
  </g>

  <text x="160" y="264" text-anchor="middle" font-size="11" fill="#666">The root can be any of the 12 keys — every other note in the scale is counted relative to it.</text>
</svg>

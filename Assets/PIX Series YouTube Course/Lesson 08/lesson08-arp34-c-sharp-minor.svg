<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 362" font-family="sans-serif">
  <rect width="540" height="362" fill="#fafafa"/>
  <text x="270" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#243447">Advanced Arpeggio 3 (4/4) &amp; 4 (3/4) — C# minor</text>
  <text x="270" y="44" text-anchor="middle" font-size="12" fill="#243447"><tspan fill="#c9622a" font-weight="bold">LH:</tspan> C# (G# C#′) (G# C#′) (C#′ E′ G#′) (G# C#′)</text>
  <path d="M14 92 V86 H286 V92" fill="none" stroke="#c9622a" stroke-width="2"/>
  <text x="150" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#c9622a">Normal octave</text>
  <path d="M294 92 V86 H526 V92" fill="none" stroke="#d64545" stroke-width="2"/>
  <text x="410" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#d64545">Octave higher (′ = red in the video)</text>
  <g transform="translate(0,96)">
    <g stroke="#333" stroke-width="1.5">
      <rect x="10" y="0" width="40" height="180" fill="#ffffff"/><rect x="50" y="0" width="40" height="180" fill="#ffffff"/><rect x="90" y="0" width="40" height="180" fill="#ffffff"/><rect x="130" y="0" width="40" height="180" fill="#ffffff"/><rect x="170" y="0" width="40" height="180" fill="#ffffff"/><rect x="210" y="0" width="40" height="180" fill="#ffffff"/><rect x="250" y="0" width="40" height="180" fill="#ffffff"/><rect x="290" y="0" width="40" height="180" fill="#ffffff"/><rect x="330" y="0" width="40" height="180" fill="#ffffff"/><rect x="370" y="0" width="40" height="180" fill="#ffffff"/><rect x="410" y="0" width="40" height="180" fill="#ffffff"/><rect x="450" y="0" width="40" height="180" fill="#ffffff"/><rect x="490" y="0" width="40" height="180" fill="#ffffff"/>
    </g>
    <g stroke="#000" stroke-width="1" fill="#222222">
      <rect x="38" y="0" width="24" height="110"/><rect x="78" y="0" width="24" height="110"/><rect x="158" y="0" width="24" height="110"/><rect x="198" y="0" width="24" height="110"/><rect x="238" y="0" width="24" height="110"/><rect x="318" y="0" width="24" height="110"/><rect x="358" y="0" width="24" height="110"/><rect x="438" y="0" width="24" height="110"/><rect x="478" y="0" width="24" height="110"/>
    </g>
    <g>
      <circle cx="50" cy="96" r="10" fill="#3a8f5c" stroke="#ffffff" stroke-width="1"/><circle cx="210" cy="96" r="10" fill="#2c6fbb" stroke="#ffffff" stroke-width="1"/><circle cx="210" cy="74" r="10" fill="#2c6fbb" stroke="#ffffff" stroke-width="1"/><circle cx="210" cy="52" r="10" fill="#2c6fbb" stroke="#ffffff" stroke-width="1"/><circle cx="330" cy="96" r="10" fill="#3a8f5c" stroke="#ffffff" stroke-width="1"/><circle cx="330" cy="74" r="10" fill="#3a8f5c" stroke="#ffffff" stroke-width="1"/><circle cx="330" cy="52" r="10" fill="#3a8f5c" stroke="#ffffff" stroke-width="1"/><circle cx="330" cy="30" r="10" fill="#3a8f5c" stroke="#ffffff" stroke-width="1"/><circle cx="390" cy="166" r="10" fill="#2c6fbb" stroke="#ffffff" stroke-width="1"/><circle cx="490" cy="96" r="10" fill="#2c6fbb" stroke="#ffffff" stroke-width="1"/>
    </g>
    <g fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">
      <text x="50" y="100">1</text><text x="210" y="100">2</text><text x="210" y="78">3</text><text x="210" y="56">5</text><text x="330" y="100">2</text><text x="330" y="78">3</text><text x="330" y="56">4</text><text x="330" y="34">5</text><text x="390" y="170">4</text><text x="490" y="100">4</text>
    </g>
    <g fill="#888" font-size="12" text-anchor="middle">
      <text x="30" y="196">C</text><text x="70" y="196">D</text><text x="110" y="196">E</text><text x="150" y="196">F</text><text x="190" y="196">G</text><text x="230" y="196">A</text><text x="270" y="196">B</text><text x="310" y="196">C</text><text x="350" y="196">D</text><text x="390" y="196">E</text><text x="430" y="196">F</text><text x="470" y="196">G</text><text x="510" y="196">A</text>
    </g>
    <g fill="#243447" font-size="10" font-weight="bold" text-anchor="middle">
      <text x="50" y="196">C#</text><text x="210" y="196">G#</text><text x="330" y="196">C#</text><text x="490" y="196">G#</text>
    </g>
    <g font-size="12" font-weight="bold" text-anchor="middle">
      <text x="50" y="213" fill="#c9622a">5</text><text x="210" y="213" fill="#c9622a">2</text><text x="330" y="213" fill="#c9622a">1/5</text><text x="390" y="213" fill="#c9622a">3</text><text x="490" y="213" fill="#c9622a">1</text>
    </g>
  </g>
  <text x="270" y="324" text-anchor="middle" font-size="10" fill="#52616b">Numbers = playing order; stacked badges = same key played again.</text>
  <text x="270" y="338" text-anchor="middle" font-size="10" fill="#52616b">Notes in ( ) are grouped and share one number. LH only. Green = root.</text>
  <text x="270" y="352" text-anchor="middle" font-size="10" fill="#52616b">Orange numbers under the keys = LH finger (1 = thumb … 5 = pinky).</text>
</svg>

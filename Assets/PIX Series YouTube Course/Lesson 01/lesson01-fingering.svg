<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 270" font-family="sans-serif">
  <text x="160" y="16" text-anchor="middle" font-size="13" fill="#333">Base Scale Fingering — Sa Re Ga Ma Pa Dha Ni Sa (Sa = C)</text>

  <g transform="translate(0,24)">
    <!-- white keys -->
    <g stroke="#333" stroke-width="1.5">
      <rect x="0"   y="0" width="40" height="220" fill="#ffffff"/>
      <rect x="40"  y="0" width="40" height="220" fill="#ffffff"/>
      <rect x="80"  y="0" width="40" height="220" fill="#ffffff"/>
      <rect x="120" y="0" width="40" height="220" fill="#ffffff"/>
      <rect x="160" y="0" width="40" height="220" fill="#ffffff"/>
      <rect x="200" y="0" width="40" height="220" fill="#ffffff"/>
      <rect x="240" y="0" width="40" height="220" fill="#ffffff"/>
      <rect x="280" y="0" width="40" height="220" fill="#ffffff"/>
    </g>

    <!-- black keys, unlabeled (context only) -->
    <g stroke="#000" stroke-width="1" fill="#222222">
      <rect x="28"  y="0" width="24" height="130"/>
      <rect x="68"  y="0" width="24" height="130"/>
      <rect x="148" y="0" width="24" height="130"/>
      <rect x="188" y="0" width="24" height="130"/>
      <rect x="228" y="0" width="24" height="130"/>
    </g>

    <!-- letter names -->
    <g fill="#666" font-size="13" text-anchor="middle">
      <text x="20"  y="150">C</text>
      <text x="60"  y="150">D</text>
      <text x="100" y="150">E</text>
      <text x="140" y="150">F</text>
      <text x="180" y="150">G</text>
      <text x="220" y="150">A</text>
      <text x="260" y="150">B</text>
      <text x="300" y="150">C</text>
    </g>

    <!-- sargam names -->
    <g fill="#888" font-size="10" font-style="italic" text-anchor="middle">
      <text x="20"  y="168">Sa</text>
      <text x="60"  y="168">Re</text>
      <text x="100" y="168">Ga</text>
      <text x="140" y="168">Ma</text>
      <text x="180" y="168">Pa</text>
      <text x="220" y="168">Dha</text>
      <text x="260" y="168">Ni</text>
      <text x="300" y="168">Sa</text>
    </g>

    <!-- finger badges -->
    <g>
      <circle cx="20"  cy="196" r="16" fill="#2c6fbb"/>
      <circle cx="60"  cy="196" r="16" fill="#2c6fbb"/>
      <circle cx="100" cy="196" r="17" fill="#c9622a"/>
      <circle cx="140" cy="196" r="16" fill="#2c6fbb"/>
      <circle cx="180" cy="196" r="16" fill="#2c6fbb"/>
      <circle cx="220" cy="196" r="16" fill="#2c6fbb"/>
      <circle cx="260" cy="196" r="17" fill="#c9622a"/>
      <circle cx="300" cy="196" r="16" fill="#2c6fbb"/>
    </g>
    <g fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">
      <text x="20"  y="201">1</text>
      <text x="60"  y="201">2</text>
      <text x="100" y="200" font-size="11">Th</text>
      <text x="140" y="201">1</text>
      <text x="180" y="201">2</text>
      <text x="220" y="201">3</text>
      <text x="260" y="200" font-size="11">Th</text>
      <text x="300" y="201">1</text>
    </g>
  </g>

  <text x="160" y="264" text-anchor="middle" font-size="11" fill="#666">Blue = finger 1/2/3, Orange = thumb-under (Th). See Fingering Notation.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 230" font-family="sans-serif">
  <rect x="0" y="0" width="320" height="230" fill="none"/>
  <text x="160" y="18" text-anchor="middle" font-size="14" fill="#333">One Octave: C to C</text>

  <g transform="translate(0,20)">
    <!-- white keys -->
    <g stroke="#333" stroke-width="1.5">
      <rect x="0"   y="0" width="40" height="180" fill="#ffffff"/>
      <rect x="40"  y="0" width="40" height="180" fill="#ffffff"/>
      <rect x="80"  y="0" width="40" height="180" fill="#ffffff"/>
      <rect x="120" y="0" width="40" height="180" fill="#ffffff"/>
      <rect x="160" y="0" width="40" height="180" fill="#ffffff"/>
      <rect x="200" y="0" width="40" height="180" fill="#ffffff"/>
      <rect x="240" y="0" width="40" height="180" fill="#ffffff"/>
      <rect x="280" y="0" width="40" height="180" fill="#ffffff"/>
    </g>

    <!-- white key labels -->
    <g fill="#111" font-size="16" text-anchor="middle">
      <text x="20"  y="165">C</text>
      <text x="60"  y="165">D</text>
      <text x="100" y="165">E</text>
      <text x="140" y="165">F</text>
      <text x="180" y="165">G</text>
      <text x="220" y="165">A</text>
      <text x="260" y="165">B</text>
      <text x="300" y="165">C</text>
    </g>

    <!-- black keys -->
    <g stroke="#000" stroke-width="1">
      <rect x="28"  y="0" width="24" height="110" fill="#222222"/>
      <rect x="68"  y="0" width="24" height="110" fill="#222222"/>
      <rect x="148" y="0" width="24" height="110" fill="#222222"/>
      <rect x="188" y="0" width="24" height="110" fill="#222222"/>
      <rect x="228" y="0" width="24" height="110" fill="#222222"/>
    </g>

    <!-- black key labels -->
    <g fill="#ffffff" font-size="9" text-anchor="middle">
      <text x="40"  y="100">C#</text>
      <text x="80"  y="100">D#</text>
      <text x="160" y="100">F#</text>
      <text x="200" y="100">G#</text>
      <text x="240" y="100">A#</text>
    </g>
  </g>

  <text x="160" y="228" text-anchor="middle" font-size="11" fill="#666">No black key between E-F and B-C — see Sharps &amp; Flats</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 560" font-family="sans-serif">
  <rect width="320" height="560" fill="#fafafa"/>
  <text x="160" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#243447">Chord Shape: Major vs Minor</text>

  <text x="160" y="46" text-anchor="middle" font-size="13" fill="#243447">C Major — C · E · G</text>
  <g transform="translate(0,56)">
    <g stroke="#333" stroke-width="1.5">
      <rect x="0"   y="0" width="40" height="180" fill="#ffffff"/>
      <rect x="40"  y="0" width="40" height="180" fill="#ffffff"/>
      <rect x="80"  y="0" width="40" height="180" fill="#ffffff"/>
      <rect x="120" y="0" width="40" height="180" fill="#ffffff"/>
      <rect x="160" y="0" width="40" height="180" fill="#ffffff"/>
      <rect x="200" y="0" width="40" height="180" fill="#ffffff"/>
      <rect x="240" y="0" width="40" height="180" fill="#ffffff"/>
      <rect x="280" y="0" width="40" height="180" fill="#ffffff"/>
    </g>
    <g stroke="#000" stroke-width="1" fill="#222222">
      <rect x="28"  y="0" width="24" height="110"/>
      <rect x="68"  y="0" width="24" height="110"/>
      <rect x="148" y="0" width="24" height="110"/>
      <rect x="188" y="0" width="24" height="110"/>
      <rect x="228" y="0" width="24" height="110"/>
    </g>
    <g fill="#666" font-size="12" text-anchor="middle">
      <text x="20" y="132">C</text><text x="60" y="132">D</text><text x="100" y="132">E</text><text x="140" y="132">F</text><text x="180" y="132">G</text><text x="220" y="132">A</text><text x="260" y="132">B</text><text x="300" y="132">C</text>
    </g>
    <circle cx="20"  cy="162" r="14" fill="#3a8f5c"/>
    <circle cx="100" cy="162" r="14" fill="#c9622a"/>
    <circle cx="180" cy="162" r="14" fill="#2c6fbb"/>
    <g fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">
      <text x="20"  y="167">1</text>
      <text x="100" y="167">3</text>
      <text x="180" y="167">5</text>
    </g>
  </g>

  <text x="160" y="270" text-anchor="middle" font-size="12" fill="#c9622a" font-weight="bold">↓ finger 3 moves down one half step ↓</text>

  <text x="160" y="296" text-anchor="middle" font-size="13" fill="#243447">C Minor — C · D# · G</text>
  <g transform="translate(0,306)">
    <g stroke="#333" stroke-width="1.5">
      <rect x="0"   y="0" width="40" height="180" fill="#ffffff"/>
      <rect x="40"  y="0" width="40" height="180" fill="#ffffff"/>
      <rect x="80"  y="0" width="40" height="180" fill="#ffffff"/>
      <rect x="120" y="0" width="40" height="180" fill="#ffffff"/>
      <rect x="160" y="0" width="40" height="180" fill="#ffffff"/>
      <rect x="200" y="0" width="40" height="180" fill="#ffffff"/>
      <rect x="240" y="0" width="40" height="180" fill="#ffffff"/>
      <rect x="280" y="0" width="40" height="180" fill="#ffffff"/>
    </g>
    <g stroke="#000" stroke-width="1" fill="#222222">
      <rect x="28"  y="0" width="24" height="110"/>
      <rect x="68"  y="0" width="24" height="110"/>
      <rect x="148" y="0" width="24" height="110"/>
      <rect x="188" y="0" width="24" height="110"/>
      <rect x="228" y="0" width="24" height="110"/>
    </g>
    <g fill="#666" font-size="12" text-anchor="middle">
      <text x="20" y="132">C</text><text x="60" y="132">D</text><text x="100" y="132">E</text><text x="140" y="132">F</text><text x="180" y="132">G</text><text x="220" y="132">A</text><text x="260" y="132">B</text><text x="300" y="132">C</text>
    </g>
    <circle cx="20" cy="162" r="14" fill="#3a8f5c"/>
    <circle cx="80" cy="90"  r="12" fill="#c9622a" stroke="#fff" stroke-width="1.5"/>
    <circle cx="180" cy="162" r="14" fill="#2c6fbb"/>
    <g fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">
      <text x="20" y="167">1</text>
      <text x="80" y="94">3</text>
      <text x="180" y="167">5</text>
    </g>
  </g>

  <text x="160" y="528" text-anchor="middle" font-size="11" fill="#52616b">Root (1) and 5th (5) never move between a chord's major and minor version.</text>
  <text x="160" y="546" text-anchor="middle" font-size="11" fill="#52616b">Only the 3rd (finger 3) shifts — one half step. RH: 1-3-5 · LH: 5-3-1 (mirrored).</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" font-family="sans-serif">
  <text x="160" y="16" text-anchor="middle" font-size="13" fill="#333">C Major Scale — Scale Degrees 1 to 8</text>

  <g transform="translate(0,24)">
    <!-- white keys -->
    <g stroke="#333" stroke-width="1.5">
      <rect x="0"   y="0" width="40" height="200" fill="#ffffff"/>
      <rect x="40"  y="0" width="40" height="200" fill="#ffffff"/>
      <rect x="80"  y="0" width="40" height="200" fill="#ffffff"/>
      <rect x="120" y="0" width="40" height="200" fill="#ffffff"/>
      <rect x="160" y="0" width="40" height="200" fill="#ffffff"/>
      <rect x="200" y="0" width="40" height="200" fill="#ffffff"/>
      <rect x="240" y="0" width="40" height="200" fill="#ffffff"/>
      <rect x="280" y="0" width="40" height="200" fill="#ffffff"/>
    </g>

    <!-- black keys, unlabeled (context only — C major uses none of them) -->
    <g stroke="#000" stroke-width="1" fill="#222222">
      <rect x="28"  y="0" width="24" height="120"/>
      <rect x="68"  y="0" width="24" height="120"/>
      <rect x="148" y="0" width="24" height="120"/>
      <rect x="188" y="0" width="24" height="120"/>
      <rect x="228" y="0" width="24" height="120"/>
    </g>

    <!-- letter names -->
    <g fill="#666" font-size="13" text-anchor="middle">
      <text x="20"  y="150">C</text>
      <text x="60"  y="150">D</text>
      <text x="100" y="150">E</text>
      <text x="140" y="150">F</text>
      <text x="180" y="150">G</text>
      <text x="220" y="150">A</text>
      <text x="260" y="150">B</text>
      <text x="300" y="150">C</text>
    </g>

    <!-- scale degree badges -->
    <g>
      <circle cx="20"  cy="175" r="15" fill="#3a8f5c"/>
      <circle cx="60"  cy="175" r="15" fill="#2c6fbb"/>
      <circle cx="100" cy="175" r="15" fill="#2c6fbb"/>
      <circle cx="140" cy="175" r="15" fill="#2c6fbb"/>
      <circle cx="180" cy="175" r="15" fill="#2c6fbb"/>
      <circle cx="220" cy="175" r="15" fill="#2c6fbb"/>
      <circle cx="260" cy="175" r="15" fill="#2c6fbb"/>
      <circle cx="300" cy="175" r="15" fill="#3a8f5c"/>
    </g>
    <g fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">
      <text x="20"  y="180">1</text>
      <text x="60"  y="180">2</text>
      <text x="100" y="180">3</text>
      <text x="140" y="180">4</text>
      <text x="180" y="180">5</text>
      <text x="220" y="180">6</text>
      <text x="260" y="180">7</text>
      <text x="300" y="180">8</text>
    </g>
  </g>

  <text x="160" y="244" text-anchor="middle" font-size="11" fill="#666">Green = the root/tonic (degree 1, repeated as degree 8 one octave up)</text>
</svg>
